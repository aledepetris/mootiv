<div class="grid">
    <div class="col-12">
        <div class="card">
            <h5>Lista de Ejercicios</h5>
            <p-dataView #dv [value]="exercises" [paginator]="true" [rows]="10" filterBy="name" layout="list">
                <ng-template pTemplate="header">
                    <div class="flex flex-column md:flex-row md:justify-content-between gap-2">
                        <!-- Campo de búsqueda -->
                        <span class="p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input type="search" pInputText placeholder="Nombre" (input)="onFilter(dv, $event)">
                        </span>
                        <!-- Botón Nuevo Ejercicio -->
                        <button pButton type="button" label="Nuevo ejercicio" [routerLink]="['/exercises/new']"
                            icon="pi pi-plus" class="mr-2"></button>
                    </div>
                </ng-template>

                <ng-template let-exercises pTemplate="listItem">
                    <div class="col-12" *ngFor="let exercise of exercises">
                        <div class="flex flex-row align-items-center p-2 w-full">
                            <!-- Imagen -->
                            <img [src]="exercise | exerciseImage" [alt]="exercise.name" class="small-image mr-3" />

                            <!-- Información del ejercicio -->
                            <div class="flex-1 flex flex-column text-left">
                                <div class="font-bold text-md pb-2">{{ exercise.name }}</div>
                                <div class="text-sm text-secondary">{{ exercise.description }}</div>
                                <div class="mt-2 flex gap-2">
                                    <!-- Badge TIEMPO o CANTIDAD -->
                                    <span class="badge"
                                        [ngClass]="exercise.forTime ? 'p-badge-info' : 'p-badge-success'">
                                        {{ exercise.forTime ? 'TIEMPO' : 'CANTIDAD' }}
                                    </span>
                                    <!-- Badge LADO/EXTREMIDAD -->
                                    <span class="badge p-badge-warning" *ngIf="!exercise.total">
                                        LADO/EXTREMIDAD
                                    </span>
                                </div>
                            </div>

                            <!-- Acciones -->
                            <div class="flex align-items-center ml-auto">
                                <p-button [routerLink]="['/exercises', exercise.id]" icon="pi pi-pencil"
                                    styleClass="p-button-sm mr-2"></p-button>
                                <p-button icon="pi pi-trash" styleClass="p-button-danger p-button-sm"
                                    (click)="confirmDelete(exercise.id)">
                                </p-button>
                            </div>
                        </div>
                    </div>
                </ng-template>
            </p-dataView>
        </div>
    </div>
</div>
