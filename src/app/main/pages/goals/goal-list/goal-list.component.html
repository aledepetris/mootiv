<div class="grid">
    <div class="col-12">
        <div class="card">
            <h5>Objetivos</h5>
            <p-dataView #dv [value]="goals" [paginator]="true" [rows]="20" filterBy="name" [sortField]="sortField"
                [sortOrder]="sortOrder" layout="list">
                <ng-template pTemplate="header">
                    <div class="flex flex-column md:flex-row md:justify-content-between gap-2">
                        <span class="p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input type="search" pInputText placeholder="Buscar.." (input)="onFilter(dv, $event)" />
                        </span>
                        <button pButton type="button" label="Nuevo Objetivo" [routerLink]="['/goals/new']"
                            icon="pi pi-plus" class="mr-2"></button>
                    </div>
                </ng-template>

                <!-- Lista con días y metas -->
                <ng-template let-goals pTemplate="listItem">
                    <div class="col-12" *ngFor="let goal of goals">
                        <div class="flex flex-row align-items-start p-2 w-full border-bottom-1 surface-border">
                            <!-- Nombre y Descripción -->
                            <div class="flex-1 flex flex-column text-left">
                                <div class="font-bold text-lg">{{ goal.name }}</div>
                                <div class="text-sm text-secondary mt-1">{{ goal.description }}</div>

                                <!-- Mostrar días y metas -->
                                <div class="mt-2">
                                    <ng-container *ngFor="let schedule of goal.scheduleGoal">
                                        <div class="flex align-items-center mb-1">
                                            <!-- Día como badge -->
                                            <p-badge value="{{ schedule.day }}"
                                                styleClass="mr-2 p-badge-primary"></p-badge>
                                            <!-- Metas como chips -->
                                            <p-chip *ngFor="let typeId of schedule.idsTrainingTypes"
                                                [label]="getTrainingTypeName(typeId)" styleClass="mr-1"></p-chip>
                                        </div>
                                    </ng-container>
                                </div>
                            </div>

                            <!-- Botones de acción -->
                            <div class="flex align-items-center ml-auto">
                                <p-button [routerLink]="['/goals', goal.id]" icon="pi pi-pencil"
                                    styleClass="p-button-sm mr-2"></p-button>
                                <p-button icon="pi pi-trash" styleClass="p-button-danger p-button-sm"
                                    (click)="confirmDelete(goal.id)"></p-button>
                            </div>
                        </div>
                    </div>
                </ng-template>
            </p-dataView>
        </div>
    </div>
</div>
