<div class="grid">
    <div class="col-12">
        <div class="card p-fluid w-full">
            <div class="p-1 w-full">
                <h5>{{ isEditMode ? 'Editar Objetivo' : 'Nuevo Objetivo' }}</h5>
                <br />

                <!-- Nombre -->
                <div class="field mb-3">
                    <label for="name">Nombre</label>
                    <input pInputText id="name" type="text" placeholder="Ingrese el nombre" [(ngModel)]="goalForm.name"
                        name="name" class="w-full" />
                </div>

                <!-- Descripción -->
                <div class="field mb-3">
                    <label for="description">Descripción</label>
                    <textarea pInputTextarea id="description" rows="3" placeholder="Ingrese la descripción"
                        [(ngModel)]="goalForm.description" name="description" class="w-full"></textarea>
                </div>

                <!-- Schedule Goals -->
                <div *ngFor="let scheduleGoal of scheduleGoals; let i = index" class="mb-3">
                    <div class="grid align-items-center">
                        <!-- Día -->
                        <!-- Cantidad de días -->
                        <div class="col-5">
                            <label for="day-{{ i }}">Cantidad días</label>
                            <input pInputText id="day-{{ i }}" placeholder="Ingrese el día (ej. Lunes)"
                                [(ngModel)]="scheduleGoals[i].day" class="w-full"
                                [ngClass]="{'p-invalid': !scheduleGoals[i].day}" />
                        </div>


                        <!-- Tipos de Entrenamiento -->
                        <div class="col-6">
                            <label for="trainingTypes-{{ i }}">Tipos de Entrenamiento</label>
                            <p-multiSelect id="trainingTypes-{{ i }}" class="w-full" [options]="trainingTypesOptions"
                                [(ngModel)]="scheduleGoals[i].idsTrainingTypes"
                                placeholder="Seleccione tipos de entrenamiento"
                                [ngClass]="{'p-invalid': scheduleGoals[i].idsTrainingTypes.length === 0}">
                            </p-multiSelect>
                        </div>

                        <!-- Botón Eliminar -->
                        <div class="col-1 d-flex align-items-center justify-content-center pt-5">
                            <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-sm"
                                (click)="removeScheduleGoal(i)"></button>
                        </div>
                    </div>
                </div>

                <!-- Botón Añadir -->
                <div class="mt-3 text-center">
                    <button pButton type="button" label="Añadir Meta" icon="pi pi-plus" class="p-button-outlined"
                        (click)="addScheduleGoal()"></button>
                </div>

                <!-- Botón Guardar -->
                <div class="card text-center mt-3">
                    <button pButton type="button" label="{{ isEditMode ? 'Actualizar' : 'Guardar' }}"
                        class="p-button-success w-full" (click)="onSubmit()"></button>
                </div>
            </div>
        </div>
    </div>
</div>
