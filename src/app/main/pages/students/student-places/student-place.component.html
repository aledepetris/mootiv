<div class="col-12">
    <header-student [student]="student" (navigate)="navigateTo($event)"></header-student>

    <div class="card">
        <h5>Lugares de entrenamiento</h5>
        <p-dataView #dv [value]="places" [paginator]="true" [rows]="20" filterBy="name" [sortField]="sortField"
            [sortOrder]="sortOrder" layout="list">
            <ng-template pTemplate="header">
                <div class="flex flex-column md:flex-row md:justify-content-between gap-2">
                    <span class="p-input-icon-left">
                        <i class="pi pi-search"></i>
                        <input type="search" pInputText placeholder="Buscar por nombre"
                            (input)="onFilter(dv, $event)" />
                    </span>
                    <button pButton type="button" label="Nuevo lugar"
                        [routerLink]="['/students/location', student.id, 'form']" icon="pi pi-plus"
                        class="mr-2"></button>
                </div>
            </ng-template>

            <!-- Lista sin imágenes -->
            <ng-template let-places pTemplate="listItem">
                <div class="col-12" *ngFor="let place of places">
                    <div class="flex flex-row align-items-center p-2 w-full border-bottom-1 surface-border">
                        <div class="flex-1 flex flex-column text-left">
                            <div class="font-bold text-lg">{{ place.name }}</div>
                        </div>
                        <div class="flex-1 flex flex-column text-left">
                            <div *ngIf="place.equipments && place.equipments.length > 0; else noEquipment">
                                <div class="grid">
                                    <div class="col-12">
                                        <button (click)="showEquipments(place)" pButton icon="pi pi-external-link"
                                            label="Equipo"></button>

                                    </div>
                                </div>
                            </div>
                            <ng-template #noEquipment>
                                <span>Sin equipo</span>
                            </ng-template>
                        </div>
                        <div class="flex align-items-center ml-auto">
                            <p-button [routerLink]="['/students/location', student.id, 'form', place.id]"
                                icon="pi pi-plus" icon="pi pi-pencil" styleClass="p-button-sm mr-2"></p-button>
                            <p-button icon="pi pi-trash" styleClass="p-button-danger p-button-sm"
                                (click)="confirmDelete(place.id)"></p-button>
                        </div>
                    </div>
                </div>
            </ng-template>
        </p-dataView>
    </div>
    <p-dialog header="Equipos" [(visible)]="display" [modal]="true" showEffect="fade"
        [style]="{width: '30vw', height: '60vh'}" [breakpoints]="{'960px': '75vw'}">
        <div class="p-3" style="overflow-y: auto; max-height: 100%;">
            <ul>
                <li *ngFor="let equipment of selectedPlace?.equipments" style="font-size: 1.2rem;">
                    {{ equipment }}
                </li>
            </ul>
        </div>
        <ng-template pTemplate="footer">
            <button pButton icon="pi pi-check" (click)="display=false" label="Cerrar"
                class="p-button-outlined"></button>
        </ng-template>
    </p-dialog>

</div>
