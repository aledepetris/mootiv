<div class="grid">
    <div class="col-12">
        <div class="card p-fluid">
            <h5>{{ isEditMode ? 'Editar Estudiante' : 'Nuevo Estudiante' }}</h5>

            <div class="grid">
                <!-- Sección Foto -->
                <div class="col-12 md:col-4 text-center">
                    <img [src]="photoUrl" 
                         (error)="onImageError()" 
                         alt="Foto del Estudiante" 
                         class="circle-photo mb-3">
                    <div class="field">
                        <label for="photoUrl">URL de la Foto</label>
                        <input id="photoUrl" 
                               pInputText 
                               type="text" 
                               placeholder="Pegue la URL de la foto"
                               [(ngModel)]="photoUrl" 
                               (ngModelChange)="updatePhotoUrl($event)">
                    </div>
                </div>

                <!-- Sección Información -->
                <div class="col-12 md:col-8">
                    <div class="field">
                        <label for="dni">DNI</label>
                        <input pInputText id="dni" type="number" placeholder="Ingrese DNI"
                            [(ngModel)]="studentForm.dni">
                    </div>

                    <div class="p-formgrid grid">
                        <div class="field col">
                            <label for="name">Nombre</label>
                            <input pInputText id="name" type="text" placeholder="Ingrese Nombre"
                                [(ngModel)]="studentForm.name">
                        </div>
                        <div class="field col">
                            <label for="lastName">Apellido</label>
                            <input pInputText id="lastName" type="text" placeholder="Ingrese Apellido"
                                [(ngModel)]="studentForm.lastName">
                        </div>
                    </div>

                    <div class="field">
                        <label for="email">Correo Electrónico</label>
                        <input pInputText id="email" type="email" placeholder="Ingrese Email"
                            [(ngModel)]="studentForm.email">
                    </div>

                    <div class="field">
                        <label for="telephone">Teléfono</label>
                        <input pInputText id="telephone" type="text" placeholder="Ingrese Teléfono"
                            [(ngModel)]="studentForm.telephone">
                    </div>

                    <div class="field">
                        <label for="birthdate">Fecha de Nacimiento</label>
                        <p-calendar id="birthdate" [(ngModel)]="studentForm.birthdate" dateFormat="dd/mm/yy"
                            placeholder="Seleccione Fecha"></p-calendar>
                    </div>

                    <div class="field">
                        <label for="startDate">Fecha de Inicio de Actividad</label>
                        <p-calendar id="startDate" [(ngModel)]="studentForm.startDate" dateFormat="dd/mm/yy"
                            placeholder="Seleccione Fecha"></p-calendar>
                    </div>
                </div>
            </div>

            <!-- Botón Guardar -->
            <button pButton type="button" label="Guardar" icon="pi pi-check" class="p-button-success w-full mt-3"
                (click)="onSubmit()"></button>
        </div>
    </div>
</div>
