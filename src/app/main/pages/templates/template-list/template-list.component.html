<div class="grid">
    <div class="col-12">
        <div class="card">
            <h5>Template de ejercicios</h5>
            <p-dataView #dv [value]="templates" [paginator]="true" [rows]="20" filterBy="name" layout="list">
                <ng-template pTemplate="header">
                    <div class="flex flex-column md:flex-row md:justify-content-between gap-2">
                        <span class="p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input type="search" pInputText placeholder="Buscar por nombre"
                                (input)="onFilter(dv, $event)" />
                        </span>
                        <button pButton type="button" label="Nueva Template" [routerLink]="['/templates/new']"
                            icon="pi pi-plus" class="mr-2"></button>
                    </div>
                </ng-template>

                <!-- Lista sin imágenes -->
                <ng-template let-templates pTemplate="listItem">
                    <div class="col-12" *ngFor="let template of templates">
                        <div class="flex flex-row align-items-center p-2 w-full border-bottom-1 surface-border">
                            <div class="flex-1 flex flex-column text-left">
                                <div class="font-bold text-lg">{{ template.name }}</div>
                                <div class="text-sm text-secondary mt-1">{{ template.description }}</div>
                            </div>
                            <div class="flex align-items-center ml-auto">
                                <p-button [routerLink]="['/templates', template.id]" icon="pi pi-pencil"
                                    styleClass="p-button-sm mr-2"></p-button>
                                <p-button icon="pi pi-trash" styleClass="p-button-danger p-button-sm"
                                    (click)="confirmDelete(template.id)"></p-button>
                            </div>
                        </div>
                    </div>
                </ng-template>
            </p-dataView>
        </div>
    </div>
</div>
