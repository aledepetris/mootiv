<p-card>
  <ng-template pTemplate="header">
    <div class="flex justify-content-between align-items-center px-4">
      <div>
        <div class="text-xl font-bold gap-2 mt-2">{{ trainer.name }} {{ trainer.lastName }}</div>
        <div class="text-sm text-secondary gap-2 mt-2">info importante 1</div>
      </div>
    </div>
  </ng-template>

  <img [src]="trainer | trainerImage" [alt]="trainer.name" class="responsive-img">

  <div class="mt-1">
    <h4 class="text-lg">info importante 2</h4>
    <p>
      <strong>Entrenador desde:</strong> {{ trainer.name }}
      <br>
      <div class="flex flex-wrap gap-2 mt-2">
        {{ trainer.name }}
      </div>
  </div>

  <p-divider></p-divider>

  <div class="flex justify-content-end mt-2">
    <button pButton pRipple label="Ver" icon="pi pi-eye" iconPos="right" [routerLink]="['/trainers', trainer.id]"></button>
  </div>

</p-card>
