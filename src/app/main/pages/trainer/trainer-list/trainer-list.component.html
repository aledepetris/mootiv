
<div class="surface-section px-5 py-4 md:px-5 lg:px-5">
  <ul class="list-none p-0 m-0 flex align-items-center font-medium mb-3">
      <li>
          <a class="text-500 no-underline line-height-3 cursor-pointer"
          routerLink="/"
          >Dashboard</a>
      </li>
      <li class="px-2">
          <i class="pi pi-angle-right text-500 line-height-3"></i>
      </li>
      <li>
          <span class="text-900 line-height-3">Entrenedores</span>
      </li>
  </ul>
  <div class="flex align-items-start flex-column lg:justify-content-between lg:flex-row">
      <div>
          <div class="font-medium text-3xl text-900">Entrenedores</div>
          <div class="flex align-items-center text-700 flex-wrap">
              <div class="mr-5 flex align-items-center mt-3">
                  <i class="pi pi-users mr-2"></i>
                  <span>18 Activos</span>
              </div>
              <div class="mr-5 flex align-items-center mt-3">
                  <i class="pi pi-globe mr-2"></i>
                  <span>30 Historico</span>
              </div>
              <div class="flex align-items-center mt-3">
                  <i class="pi pi-clock mr-2"></i>
                  <span>3 días de promedio entrenamiento</span>
              </div>
          </div>
      </div>
      <div class="mt-3 lg:mt-0">
          <button pButton pRipple label="Nuevo Entrenedor" class="p-button-outlined mr-2" icon="pi pi-user-plus"
          routerLink="/trainers/new"
          ></button>
      </div>
  </div>
</div>

<div class="px-5">
      <p-autoComplete
        [(ngModel)]="selectedTrainerAdvanced"
        [suggestions]="filteredTrainer"
        (completeMethod)="filterTrainer($event)"
        (onSelect)="onTrainerSelect($event)"
        (onClear)="restoreTrainer()"
        placeholder="Buscar entrenador.."
        >
            <ng-template let-trainer pTemplate="item">
                <div class="flex align-items-center gap-2">
                    <img
                        [src]="trainer.alt_img"
                        [class]="'flag flag-' + trainer.nombre.toLowerCase()"
                        style="width: 18px" />
                    <div>{{ trainer.nombre }}  {{trainer.apellido}}</div>
                </div>
            </ng-template>
      </p-autoComplete>
  </div>

  <div class="grid mx-4 my-2">
    <div *ngFor="let trainer of showedTrainer"
        class="col-12 sm:col-6 md:col-4 lg:col-3 xl:col-2">
      <app-trainer-card [trainer]="trainer"></app-trainer-card>
    </div>
  </div>
