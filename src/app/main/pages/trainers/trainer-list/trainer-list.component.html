<div class="grid">
    <div class="col-12">
        <div class="card">
            <h5>Entrenadores</h5>
            <p-dataView #dv [value]="trainers" [paginator]="true" [rows]="9" filterBy="name" [sortField]="sortField"
                [sortOrder]="sortOrder" layout="grid">
                <ng-template pTemplate="header">
                    <div class="flex flex-column md:flex-row md:justify-content-between gap-2">
                        <span class="p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input type="search" pInputText placeholder="Nombre" (input)="onFilter(dv, $event)" />
                        </span>
                        <button pButton type="button" label="Nuevo entrenador" [routerLink]="['/trainers/new']"
                            icon="pi pi-plus" class="mr-2"></button>
                        <p-dataViewLayoutOptions></p-dataViewLayoutOptions>
                    </div>
                </ng-template>

                <!-- Lista -->
                <ng-template let-trainers pTemplate="listItem">
                    <div class="col-12" *ngFor="let trainer of trainers">
                        <div class="flex flex-column md:flex-row align-items-center p-3 w-full">
                            <img [src]="trainer | trainerImage" [alt]="trainer.name"
                                class="my-4 md:my-0 w-9 md:w-10rem shadow-2 mr-5" />
                            <div class="flex-1 flex flex-column align-items-center text-center md:text-left">
                                <div class="font-bold text-2xl">{{ trainer.name }} {{ trainer.lastName }}</div>
                                <br />
                                <span
                                    [class]="trainer.active ? 'product-badge status-instock' : 'product-badge status-outofstock'">
                                    {{ trainer.active ? 'ACTIVO' : 'INACTIVO' }}
                                </span>
                                <div class="flex align-items-center mt-2">
                                    <i class="pi pi-phone mr-2"></i>
                                    <span class="font-semibold">{{ trainer.telephone }}</span>
                                </div>
                            </div>
                            <div
                                class="flex flex-row md:flex-column justify-content-between w-full md:w-auto align-items-center md:align-items-end mt-5 md:mt-0">
                                <p-button [routerLink]="['/trainers', trainer.id]" icon="pi pi-pencil" label="Editar"
                                    styleClass="mb-2 p-button-sm"></p-button>
                            </div>
                        </div>
                    </div>
                </ng-template>

                <!-- Cuadrícula -->
                <ng-template let-trainers pTemplate="gridItem">
                    <div class="grid grid-nogutter">
                        <div class="col-12 md:col-4" *ngFor="let trainer of trainers">
                            <div class="card m-3 border-1 surface-border">
                                <div class="flex flex-wrap gap-2 align-items-center justify-content-between mb-2">
                                    <div class="flex align-items-center">
                                        <i class="pi pi-phone mr-2"></i>
                                        <span class="font-semibold">{{ trainer.telephone }}</span>
                                    </div>
                                    <span
                                        [class]="trainer.active ? 'product-badge status-instock' : 'product-badge status-outofstock'">
                                        {{ trainer.active ? 'ACTIVO' : 'INACTIVO' }}
                                    </span>
                                </div>
                                <div class="flex flex-column align-items-center text-center mb-3">
                                    <img [src]="trainer | trainerImage" [alt]="trainer.name"
                                        class="w-9 shadow-2 my-3 mx-0" />
                                    <div class="text-2xl font-bold">{{ trainer.lastName }}</div>
                                    <div class="mb-3">{{ trainer.name }}</div>
                                </div>
                                <div class="flex justify-content-center">
                                    <p-button icon="pi pi-pencil" styleClass="p-button-sm" label="Editar"
                                        [routerLink]="['/trainers', trainer.id]"></p-button>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-template>
            </p-dataView>
        </div>
    </div>
</div>
