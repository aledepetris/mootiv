<div class="grid">
    <div class="col-12">
        <div class="card">
            <h5>Tipos de Entrenamientos</h5>
            <p-dataView #dv [value]="trainingTypes" [paginator]="true" [rows]="20" filterBy="name"
                [sortField]="sortField" [sortOrder]="sortOrder" layout="list">
                <ng-template pTemplate="header">
                    <div class="flex flex-column md:flex-row md:justify-content-between gap-2">
                        <span class="p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input type="search" pInputText placeholder="Buscar por nombre"
                                (input)="onFilter(dv, $event)" />
                        </span>
                        <button pButton type="button" label="Nuevo Tipo Entrenamiento"
                            [routerLink]="['/trainingtypes/new']" icon="pi pi-plus" class="mr-2"></button>
                    </div>
                </ng-template>

                <!-- Lista sin imágenes -->
                <ng-template let-trainingtypes pTemplate="listItem">
                    <div class="col-12" *ngFor="let trainingtype of trainingtypes">
                        <div class="flex flex-row align-items-center p-2 w-full border-bottom-1 surface-border">
                            <div class="flex-1 flex flex-column text-left">
                                <div class="font-bold text-lg">{{ trainingtype.name }}</div>
                                <div class="text-sm text-secondary mt-1">{{ trainingtype.description }}</div>
                            </div>
                            <div class="flex align-items-center ml-auto">
                                <p-button [routerLink]="['/trainingtypes', trainingtype.id]" icon="pi pi-pencil"
                                    styleClass="p-button-sm mr-2"></p-button>
                                <p-button icon="pi pi-trash" styleClass="p-button-danger p-button-sm"
                                    (click)="confirmDelete(trainingtype.id)"></p-button>
                            </div>
                        </div>
                    </div>
                </ng-template>
            </p-dataView>
        </div>
    </div>
</div>
